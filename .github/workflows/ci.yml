# ci.yml — web app template. Replace client-portal; keep actions on version tags
# (pin to SHAs before public release — P2 checklist item).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # npm deps live at the repo ROOT (frontend/ + shared/ share one lockfile).
      - name: Install
        run: npm ci

      # verify.py runs pytest for every web repo; install it when there are
      # Python tests, with or without a backend/ directory.
      - name: Install Python deps (if present)
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install -r backend/requirements.txt
          elif [ -n "$(find . -name 'test_*.py' -not -path './node_modules/*' -print -quit)" ]; then
            python -m pip install 'pytest>=9.0,<10'
          fi

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify (typecheck, lint, unit, build, pytest, e2e)
        run: python scripts/verify.py --ci --e2e
